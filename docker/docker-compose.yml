version: '3.8'

services:
  cloud-disk:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cloud-disk
    ports:
      - "8080:80"
    volumes:
      - cloud-data:/home/cloud/uploads
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai

volumes:
  cloud-data:
    driver: local
