<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绠€鍗曚簯鐩?/title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.header h1 { font-size: 20px; font-weight: 600; }
.header .user-info { display: flex; align-items: center; gap: 12px; }
.header .user-info span { font-size: 14px; }
.header .btn-logout { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.header .btn-logout:hover { background: rgba(255,255,255,.3); }
.container { max-width: 960px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 20px; margin-bottom: 16px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all .2s; }
.btn-primary { background: #1a73e8; color: #fff; }
.btn-primary:hover { background: #1557b0; }
.btn-danger { background: #d93025; color: #fff; }
.btn-danger:hover { background: #b71c1c; }
.btn-success { background: #188038; color: #fff; }
.btn-success:hover { background: #0d652d; }
.btn-outline { background: #fff; border: 1px solid #dadce0; color: #5f6368; }
.btn-outline:hover { background: #f1f3f4; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e8eaed; font-size: 14px; }
th { background: #f8f9fa; color: #5f6368; font-weight: 500; }
tr:hover { background: #f1f3f4; }
.file-name { color: #1a73e8; font-weight: 500; }
.empty-state { text-align: center; padding: 48px 0; color: #9aa0a6; }
.progress-bar { width: 100%; height: 4px; background: #e8eaed; border-radius: 2px; overflow: hidden; margin-top: 8px; display: none; }
.progress-bar .fill { height: 100%; background: #1a73e8; width: 0%; transition: width .3s; }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 9999; animation: slideIn .3s; }
.toast-success { background: #188038; }
.toast-error { background: #d93025; }
.toast-info { background: #1a73e8; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: #fff; border-radius: 8px; padding: 24px; width: 400px; max-width: 90vw; }
.modal h3 { margin-bottom: 16px; font-size: 18px; }
.modal p { margin-bottom: 16px; color: #5f6368; font-size: 14px; word-break: break-all; }
.modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.auth-box { background: #fff; border-radius: 12px; padding: 40px; width: 400px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.auth-box h2 { text-align: center; margin-bottom: 8px; color: #202124; }
.auth-box .subtitle { text-align: center; color: #5f6368; margin-bottom: 24px; font-size: 14px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #5f6368; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; outline: none; transition: border .2s; }
.form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.2); }
.auth-box .btn { width: 100%; padding: 12px; font-size: 16px; margin-top: 8px; }
.auth-box .switch-link { text-align: center; margin-top: 16px; font-size: 14px; color: #5f6368; }
.auth-box .switch-link a { color: #1a73e8; cursor: pointer; text-decoration: none; }
.auth-box .switch-link a:hover { text-decoration: underline; }
.upload-area { border: 2px dashed #dadce0; border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: all .2s; margin-bottom: 16px; }
.upload-area:hover { border-color: #1a73e8; background: #e8f0fe; }
.upload-area.dragover { border-color: #1a73e8; background: #e8f0fe; }
.upload-area p { color: #5f6368; font-size: 14px; }
.upload-area .icon { font-size: 36px; margin-bottom: 8px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<!-- Login Page -->
<div id="page-login" class="auth-page">
  <div class="auth-box">
    <h2>绠€鍗曚簯鐩?/h2>
    <p class="subtitle">鐧诲綍浣犵殑璐﹀彿</p>
    <div class="form-group">
      <label>鐢ㄦ埛鍚?/label>
      <input type="text" id="login-user" placeholder="璇疯緭鍏ョ敤鎴峰悕" autocomplete="username">
    </div>
    <div class="form-group">
      <label>瀵嗙爜</label>
      <input type="password" id="login-pass" placeholder="璇疯緭鍏ュ瘑鐮? autocomplete="current-password">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">鐧诲綍</button>
    <p class="switch-link">杩樻病鏈夎处鍙凤紵<a onclick="showPage('page-register')">绔嬪嵆娉ㄥ唽</a></p>
  </div>
</div>

<!-- Register Page -->
<div id="page-register" class="auth-page hidden">
  <div class="auth-box">
    <h2>鍒涘缓璐﹀彿</h2>
    <p class="subtitle">娉ㄥ唽鏂扮敤鎴?/p>
    <div class="form-group">
      <label>鐢ㄦ埛鍚?*</label>
      <input type="text" id="reg-user" placeholder="3-16浣嶅瓧姣嶆暟瀛椾笅鍒掔嚎">
    </div>
    <div class="form-group">
      <label>瀵嗙爜 *</label>
      <input type="password" id="reg-pass" placeholder="鑷冲皯6浣?>
    </div>
    <div class="form-group">
      <label>纭瀵嗙爜 *</label>
      <input type="password" id="reg-pass2" placeholder="鍐嶆杈撳叆瀵嗙爜">
    </div>
    <div class="form-group">
      <label>鏄电О</label>
      <input type="text" id="reg-nick" placeholder="閫夊～">
    </div>
    <div class="form-group">
      <label>閭</label>
      <input type="email" id="reg-email" placeholder="閫夊～">
    </div>
    <button class="btn btn-primary" onclick="doRegister()">娉ㄥ唽</button>
    <p class="switch-link">宸叉湁璐﹀彿锛?a onclick="showPage('page-login')">鍘荤櫥褰?/a></p>
  </div>
</div>

<!-- Main Page -->
<div id="page-main" class="hidden">
  <div class="header">
    <h1>绠€鍗曚簯鐩?/h1>
    <div class="user-info">
      <span id="display-user"></span>
      <button class="btn-logout" onclick="doLogout()">閫€鍑?/button>
    </div>
  </div>
  <div class="container">
    <!-- Upload -->
    <div class="card">
      <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
        <div class="icon">+</div>
        <p>鐐瑰嚮鎴栨嫋鎷芥枃浠跺埌杩欓噷涓婁紶</p>
      </div>
      <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(this)">
      <div class="progress-bar" id="progress-bar"><div class="fill" id="progress-fill"></div></div>
    </div>

    <!-- File List -->
    <div class="card">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="loadFileList()">鍒锋柊</button>
        <button class="btn btn-danger" onclick="deleteSelected()">鍒犻櫎閫変腑</button>
        <span id="file-count" style="color:#5f6368;font-size:14px;margin-left:auto;"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:40px"><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th>
            <th>鏂囦欢鍚?/th>
            <th style="width:100px">澶у皬</th>
            <th style="width:160px">涓婁紶鏃堕棿</th>
            <th style="width:80px">涓嬭浇</th>
            <th style="width:200px">鎿嶄綔</th>
          </tr>
        </thead>
        <tbody id="file-tbody"></tbody>
      </table>
      <div class="empty-state" id="empty-state">鏆傛棤鏂囦欢</div>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div id="share-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal('share-modal')">
  <div class="modal">
    <h3>鍒嗕韩鏂囦欢</h3>
    <p id="share-result"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('share-modal')">鍏抽棴</button>
      <button class="btn btn-primary" onclick="copyShareLink()">澶嶅埗閾炬帴</button>
    </div>
  </div>
</div>

<script>
const API = '';
let currentUser = null;
let fileList = [];

function showPage(id) {
  document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (currentUser && currentUser.token) {
    headers['X-Auth-Token'] = currentUser.token;
  }
  return fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  }).then(r => r.json());
}

function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!user || !pass) return toast('璇峰～鍐欑敤鎴峰悕鍜屽瘑鐮?, 'error');
  api('POST', '/login', { username: user, password: pass }).then(r => {
    if (r.code === '000') {
      currentUser = r.data;
      localStorage.setItem('user', JSON.stringify(currentUser));
      enterMain();
    } else {
      toast(r.message || '鐧诲綍澶辫触', 'error');
    }
  }).catch(() => toast('缃戠粶閿欒', 'error'));
}

function doRegister() {
  const user = document.getElementById('reg-user').value.trim();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  const nick = document.getElementById('reg-nick').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  if (!user || !pass) return toast('璇峰～鍐欑敤鎴峰悕鍜屽瘑鐮?, 'error');
  if (pass !== pass2) return toast('涓ゆ瀵嗙爜涓嶄竴鑷?, 'error');
  if (pass.length < 6) return toast('瀵嗙爜鑷冲皯6浣?, 'error');
  api('POST', '/register', { username: user, password: pass, nickname: nick, email: email }).then(r => {
    if (r.code === '002') {
      toast('娉ㄥ唽鎴愬姛锛岃鐧诲綍', 'success');
      showPage('page-login');
      document.getElementById('login-user').value = user;
    } else {
      toast(r.message || '娉ㄥ唽澶辫触', 'error');
    }
  }).catch(() => toast('缃戠粶閿欒', 'error'));
}

function doLogout() {
  currentUser = null;
  localStorage.removeItem('user');
  showPage('page-login');
}

function enterMain() {
  document.getElementById('display-user').textContent = currentUser.nickname || currentUser.username;
  showPage('page-main');
  loadFileList();
}

function loadFileList() {
  if (!currentUser || !currentUser.token) return;
  api('GET', '/filelist').then(r => {
    if (r.code === '000') {
      fileList = r.files || [];
      renderFileList();
    } else if (r.code === '401') {
      toast('鐧诲綍宸茶繃鏈燂紝璇烽噸鏂扮櫥褰?, 'error');
      doLogout();
    }
  });
}

function renderFileList() {
  const tbody = document.getElementById('file-tbody');
  const empty = document.getElementById('empty-state');
  const count = document.getElementById('file-count');
  document.getElementById('check-all').checked = false;

  if (fileList.length === 0) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    count.textContent = '';
    return;
  }
  empty.classList.add('hidden');
  count.textContent = '鍏?' + fileList.length + ' 涓枃浠?;

  tbody.innerHTML = fileList.map(f => {
    const size = f.size > 1048576 ? (f.size/1048576).toFixed(1)+' MB' : f.size > 1024 ? (f.size/1024).toFixed(1)+' KB' : f.size+' B';
    return `<tr>
      <td><input type="checkbox" class="file-check" value="${f.id}"></td>
      <td class="file-name">${esc(f.name)}</td>
      <td>${size}</td>
      <td>${f.time || '-'}</td>
      <td>${f.downloads || 0}</td>
      <td>
        <button class="btn btn-outline" style="padding:4px 10px;font-size:12px" onclick="downloadFile(${f.id})">涓嬭浇</button>
        <button class="btn btn-outline" style="padding:4px 10px;font-size:12px" onclick="shareFile(${f.id})">鍒嗕韩</button>
        <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteFile(${f.id},'${esc(f.name)}')">鍒犻櫎</button>
      </td>
    </tr>`;
  }).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function toggleAll(el) {
  document.querySelectorAll('.file-check').forEach(c => c.checked = el.checked);
}

function handleFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  uploadFile(file);
  input.value = '';
}

function uploadFile(file) {
  const bar = document.getElementById('progress-bar');
  const fill = document.getElementById('progress-fill');
  bar.style.display = 'block';
  fill.style.width = '0%';

  const boundary = '----FormBoundary' + Math.random().toString(36).slice(2);
  let body = '';
  body += '--' + boundary + '\r\n';
  body += 'Content-Disposition: form-data; name="user"\r\n\r\n';
  body += currentUser.username + '\r\n';
  body += '--' + boundary + '\r\n';
  body += 'Content-Disposition: form-data; name="file"; filename="' + file.name + '"; md5="pending"; size=' + file.size + '\r\n';
  body += 'Content-Type: application/octet-stream\r\n\r\n';

  const encoder = new TextEncoder();
  const bodyBytes = encoder.encode(body);
  const fileBytes = new Uint8Array(file.size);
  const footer = encoder.encode('\r\n--' + boundary + '--\r\n');

  const totalLen = bodyBytes.length + file.size + footer.length;
  const fullBody = new Uint8Array(totalLen);
  fullBody.set(bodyBytes, 0);

  const reader = new FileReader();
  reader.onload = function(e) {
    fullBody.set(new Uint8Array(e.target.result), bodyBytes.length);
    fullBody.set(footer, bodyBytes.length + file.size);

    const xhr = new XMLHttpRequest();
    xhr.open('POST', API + '/upload');
    if (currentUser && currentUser.token) {
      xhr.setRequestHeader('X-Auth-Token', currentUser.token);
    }
    xhr.upload.onprogress = function(ev) {
      if (ev.lengthComputable) {
        fill.style.width = Math.round(ev.loaded / ev.total * 100) + '%';
      }
    };
    xhr.onload = function() {
      bar.style.display = 'none';
      try {
        const r = JSON.parse(xhr.responseText);
        if (r.code === '000') {
          toast('涓婁紶鎴愬姛: ' + file.name, 'success');
          loadFileList();
        } else {
          toast(r.message || '涓婁紶澶辫触', 'error');
        }
      } catch(e) { toast('涓婁紶澶辫触', 'error'); }
    };
    xhr.onerror = function() { bar.style.display = 'none'; toast('缃戠粶閿欒', 'error'); };
    xhr.send(fullBody);
  };
  reader.readAsArrayBuffer(file);
}

function downloadFile(id) {
  if (!currentUser || !currentUser.token) return toast('璇峰厛鐧诲綍', 'error');
  window.open(API + '/download?file_id=' + id + '&token=' + encodeURIComponent(currentUser.token), '_blank');
}

function deleteFile(id, name) {
  if (!currentUser || !currentUser.token) return toast('璇峰厛鐧诲綍', 'error');
  if (!confirm('纭畾鍒犻櫎 "' + name + '" 锛?)) return;
  api('POST', '/delete', { file_id: id }).then(r => {
    if (r.code === '000') {
      toast('宸插垹闄?, 'success');
      loadFileList();
    } else if (r.code === '401') {
      toast('鐧诲綍宸茶繃鏈?, 'error');
      doLogout();
    } else {
      toast(r.message || '鍒犻櫎澶辫触', 'error');
    }
  });
}

function deleteSelected() {
  if (!currentUser || !currentUser.token) return toast('璇峰厛鐧诲綍', 'error');
  const checks = document.querySelectorAll('.file-check:checked');
  if (checks.length === 0) return toast('璇峰厛閫夋嫨鏂囦欢', 'info');
  if (!confirm('纭畾鍒犻櫎閫変腑鐨?' + checks.length + ' 涓枃浠讹紵')) return;
  const ids = Array.from(checks).map(c => parseInt(c.value));
  let done = 0;
  ids.forEach(id => {
    api('POST', '/delete', { file_id: id }).then(r => {
      done++;
      if (done === ids.length) {
        toast('宸插垹闄?' + ids.length + ' 涓枃浠?, 'success');
        loadFileList();
      }
    });
  });
}

let lastShareUrl = '';
function shareFile(id) {
  if (!currentUser || !currentUser.token) return toast('璇峰厛鐧诲綍', 'error');
  api('POST', '/share', { file_id: id, expire_days: 7 }).then(r => {
    if (r.code === '000') {
      lastShareUrl = r.data.share_url;
      document.getElementById('share-result').innerHTML =
        '鍒嗕韩閾炬帴锛?br><a href="' + r.data.share_url + '" target="_blank" style="color:#1a73e8">' + r.data.share_url + '</a>' +
        '<br><br>鏈夋晥鏈燂細' + r.data.expire;
      document.getElementById('share-modal').classList.remove('hidden');
    } else if (r.code === '401') {
      toast('鐧诲綍宸茶繃鏈?, 'error');
      doLogout();
    } else {
      toast(r.message || '鍒嗕韩澶辫触', 'error');
    }
  });
}

function copyShareLink() {
  navigator.clipboard.writeText(lastShareUrl).then(() => toast('宸插鍒?, 'success'));
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

// Drag & drop
const area = document.getElementById('upload-area');
area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
area.addEventListener('dragleave', () => area.classList.remove('dragover'));
area.addEventListener('drop', e => {
  e.preventDefault();
  area.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) uploadFile(e.dataTransfer.files[0]);
});

// Enter key
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('reg-pass2').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

// Auto login
const saved = localStorage.getItem('user');
if (saved) {
  try { currentUser = JSON.parse(saved); enterMain(); } catch(e) { showPage('page-login'); }
} else {
  showPage('page-login');
}
</script>
</body>
</html>
