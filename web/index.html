<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简单网盘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 20px; }
.header .user-info { display: flex; align-items: center; gap: 12px; }
.header .btn-logout { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
.container { max-width: 960px; margin: 24px auto; padding: 0 16px; }
.card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 20px; margin-bottom: 16px; }
.btn { padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
.btn-primary { background: #1a73e8; color: #fff; }
.btn-danger { background: #d93025; color: #fff; }
.btn-outline { background: #fff; border: 1px solid #dadce0; color: #5f6368; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e8eaed; font-size: 14px; }
th { background: #f8f9fa; color: #5f6368; }
.empty-state { text-align: center; padding: 48px 0; color: #9aa0a6; }
.progress-bar { width: 100%; height: 4px; background: #e8eaed; border-radius: 2px; overflow: hidden; margin-top: 8px; display: none; }
.progress-bar .fill { height: 100%; background: #1a73e8; width: 0%; transition: width .3s; }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 9999; }
.toast-success { background: #188038; }
.toast-error { background: #d93025; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: #fff; border-radius: 8px; padding: 24px; width: 400px; }
.modal h3 { margin-bottom: 16px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2); }
.auth-box { background: #fff; border-radius: 12px; padding: 40px; width: 400px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.auth-box h2 { text-align: center; margin-bottom: 8px; }
.auth-box .subtitle { text-align: center; color: #5f6368; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #5f6368; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #dadce0; border-radius: 6px; font-size: 14px; outline: none; }
.auth-box .btn { width: 100%; padding: 12px; font-size: 16px; margin-top: 8px; }
.auth-box .switch-link { text-align: center; margin-top: 16px; color: #5f6368; }
.auth-box .switch-link a { color: #1a73e8; cursor: pointer; }
.upload-area { border: 2px dashed #dadce0; border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; margin-bottom: 16px; }
.upload-area:hover { border-color: #1a73e8; background: #e8f0fe; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="page-login" class="auth-page">
  <div class="auth-box">
    <h2>简单网盘</h2>
    <p class="subtitle">Login</p>
    <div class="form-group"><label>Username</label><input type="text" id="login-user" placeholder="username"></div>
    <div class="form-group"><label>Password</label><input type="password" id="login-pass" placeholder="password"></div>
    <button class="btn btn-primary" onclick="doLogin()">Login</button>
    <p class="switch-link">No account? <a onclick="showPage('page-register')">Register</a></p>
  </div>
</div>
<div id="page-register" class="auth-page hidden">
  <div class="auth-box">
    <h2>Register</h2>
    <div class="form-group"><label>Username</label><input type="text" id="reg-user"></div>
    <div class="form-group"><label>Password</label><input type="password" id="reg-pass"></div>
    <div class="form-group"><label>Confirm</label><input type="password" id="reg-pass2"></div>
    <button class="btn btn-primary" onclick="doRegister()">Register</button>
    <p class="switch-link">Have account? <a onclick="showPage('page-login')">Login</a></p>
  </div>
</div>
<div id="page-main" class="hidden">
  <div class="header"><h1>简单网盘</h1><div class="user-info"><span id="display-user"></span><button class="btn-logout" onclick="doLogout()">Logout</button></div></div>
  <div class="container">
    <div class="card"><div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()"><div style="font-size:36px">+</div><p>Click or drag file here to upload</p></div><input type="file" id="file-input" class="hidden" onchange="handleFileSelect(this)"><div class="progress-bar" id="progress-bar"><div class="fill" id="progress-fill"></div></div></div>
    <div class="card"><div style="display:flex;gap:10px;align-items:center;"><button class="btn btn-primary" onclick="loadFileList()">Refresh</button><button class="btn btn-danger" onclick="deleteSelected()">Delete Selected</button><span id="file-count" style="color:#5f6368;margin-left:auto;"></span></div><table><thead><tr><th style="width:40px"><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th><th>Name</th><th style="width:100px">Size</th><th style="width:160px">Time</th><th style="width:80px">DL</th><th style="width:180px">Actions</th></tr></thead><tbody id="file-tbody"></tbody></table><div class="empty-state" id="empty-state">No files</div></div>
  </div>
</div>
<div id="share-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal('share-modal')"><div class="modal"><h3>Share File</h3><p id="share-result"></p><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal('share-modal')">Close</button><button class="btn btn-primary" onclick="copyShareLink()">Copy Link</button></div></div></div>
<div id="page-share" class="auth-page hidden"><div class="auth-box" style="max-width:500px"><h2>Shared File</h2><div style="margin:20px 0;padding:20px;background:#f8f9fa;border-radius:8px"><p><b>Name:</b> <span id="share-name"></span></p><p><b>Size:</b> <span id="share-size"></span></p><p><b>Expires:</b> <span id="share-expire"></span></p></div><button class="btn btn-primary" id="share-download-btn" onclick="shareDownload()">Download</button><p class="switch-link" style="margin-top:16px"><a onclick="showPage('page-login')">Back to Login</a></p></div></div>
<script>
const API = ''; let currentUser = null; let fileList = [];
function showPage(id) { document.querySelectorAll('[id^="page-"]').forEach(p => p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
function toast(msg, type) { const t = document.createElement('div'); t.className = 'toast toast-' + type; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function api(method, path, body) { const h = {'Content-Type':'application/json'}; if(currentUser && currentUser.token) h['X-Auth-Token']=currentUser.token; return fetch(API+path, {method, headers:h, body: body?JSON.stringify(body):undefined}).then(r=>r.json()); }
function doLogin() { var u=document.getElementById('login-user').value.trim(); var p=document.getElementById('login-pass').value; if(!u||!p) return toast('Please fill in','error'); api('POST','/login',{username:u,password:p}).then(r=>{if(r.code==='000'){currentUser=r.data;localStorage.setItem('user',JSON.stringify(currentUser));enterMain();}else toast(r.message||'Login failed','error');}).catch(()=>toast('Network error','error')); }
function doRegister() { var u=document.getElementById('reg-user').value.trim(); var p=document.getElementById('reg-pass').value; var p2=document.getElementById('reg-pass2').value; if(!u||!p) return toast('Please fill in','error'); if(p!==p2) return toast('Passwords not match','error'); if(p.length<6) return toast('Min 6 chars','error'); api('POST','/register',{username:u,password:p}).then(r=>{if(r.code==='002'){toast('Registered, please login','success');showPage('page-login');document.getElementById('login-user').value=u;}else toast(r.message||'Failed','error');}).catch(()=>toast('Network error','error')); }
function doLogout() { currentUser=null; localStorage.removeItem('user'); showPage('page-login'); }
function enterMain() { document.getElementById('display-user').textContent=currentUser.nickname||currentUser.username; showPage('page-main'); loadFileList(); }
function loadFileList() { if(!currentUser||!currentUser.token) return; api('GET','/filelist').then(r=>{if(r.code==='000'){fileList=r.files||[];renderFileList();}else if(r.code==='401'){toast('Session expired','error');doLogout();}}); }
function renderFileList() { var tb=document.getElementById('file-tbody'); var em=document.getElementById('empty-state'); var ct=document.getElementById('file-count'); document.getElementById('check-all').checked=false; if(fileList.length===0){tb.innerHTML='';em.classList.remove('hidden');ct.textContent='';return;} em.classList.add('hidden');ct.textContent=fileList.length+' files';tb.innerHTML=fileList.map(function(f){var s=f.size>1048576?(f.size/1048576).toFixed(1)+'MB':f.size>1024?(f.size/1024).toFixed(1)+'KB':f.size+'B';return '<tr><td><input type=checkbox class=file-check value='+f.id+'></td><td>'+f.name+'</td><td>'+s+'</td><td>'+(f.time||'-')+'</td><td>'+(f.downloads||0)+'</td><td><button class="btn btn-outline" style="padding:4px 10px;font-size:12px" onclick="downloadFile('+f.id+')">DL</button> <button class="btn btn-outline" style="padding:4px 10px;font-size:12px" onclick="shareFile('+f.id+')">Share</button> <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deleteFile('+f.id+',\''+f.name+'\')">Del</button></td></tr>';}).join(''); }
function toggleAll(el) { document.querySelectorAll('.file-check').forEach(function(c){c.checked=el.checked;}); }
function handleFileSelect(input) { var f=input.files[0]; if(f){uploadFile(f);input.value='';} }
function uploadFile(file) { var bar=document.getElementById('progress-bar'); var fill=document.getElementById('progress-fill'); bar.style.display='block'; fill.style.width='0%'; var bd='----FB'+Math.random().toString(36).slice(2); var body='--'+bd+'\r\nContent-Disposition: form-data; name="user"\r\n\r\n'+currentUser.username+'\r\n--'+bd+'\r\nContent-Disposition: form-data; name="file"; filename="'+file.name+'"; md5="pending"; size='+file.size+'\r\nContent-Type: application/octet-stream\r\n\r\n'; var enc=new TextEncoder(); var bb=enc.encode(body); var ft=enc.encode('\r\n--'+bd+'--\r\n'); var total=bb.length+file.size+ft.length; var fb=new Uint8Array(total); fb.set(bb,0); var reader=new FileReader(); reader.onload=function(e){fb.set(new Uint8Array(e.target.result),bb.length);fb.set(ft,bb.length+file.size);var xhr=new XMLHttpRequest();xhr.open('POST',API+'/upload');if(currentUser&&currentUser.token){xhr.setRequestHeader('X-Auth-Token',currentUser.token);}xhr.upload.onprogress=function(ev){if(ev.lengthComputable)fill.style.width=Math.round(ev.loaded/ev.total*100)+'%';};xhr.onload=function(){bar.style.display='none';try{var r=JSON.parse(xhr.responseText);if(r.code==='000'){toast('Upload OK: '+file.name,'success');loadFileList();}else toast(r.message||'Failed','error');}catch(e){toast('Failed','error');}};xhr.onerror=function(){bar.style.display='none';toast('Network error','error');};xhr.send(fb);};reader.readAsArrayBuffer(file); }
function downloadFile(id) { if(!currentUser||!currentUser.token) return toast('Login first','error'); window.open(API+'/download?file_id='+id+'&token='+encodeURIComponent(currentUser.token),'_blank'); }
function deleteFile(id,name) { if(!currentUser||!currentUser.token) return toast('Login first','error'); if(!confirm('Delete '+name+'?')) return; api('POST','/delete',{file_id:id}).then(function(r){if(r.code==='000'){toast('Deleted','success');loadFileList();}else toast(r.message||'Failed','error');}); }
function deleteSelected() { if(!currentUser||!currentUser.token) return toast('Login first','error'); var cs=document.querySelectorAll('.file-check:checked'); if(cs.length===0) return toast('Select files first','error'); if(!confirm('Delete '+cs.length+' files?')) return; Array.from(cs).forEach(function(c){api('POST','/delete',{file_id:parseInt(c.value)}).then(function(){loadFileList();});}); }
var lastShareUrl=''; function shareFile(id) { if(!currentUser||!currentUser.token) return toast('Login first','error'); api('POST','/share',{file_id:id,expire_days:7}).then(function(r){if(r.code==='000'){lastShareUrl=r.data.share_url;document.getElementById('share-result').innerHTML='Share URL:<br><a href="'+r.data.share_url+'" target="_blank">'+r.data.share_url+'</a><br><br>Expires: '+r.data.expire;document.getElementById('share-modal').classList.remove('hidden');}else toast(r.message||'Failed','error');}); }
function copyShareLink() { navigator.clipboard.writeText(lastShareUrl).then(function(){toast('Copied','success');}); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
document.getElementById('upload-area').addEventListener('dragover',function(e){e.preventDefault();});
document.getElementById('upload-area').addEventListener('drop',function(e){e.preventDefault();if(e.dataTransfer.files.length>0)uploadFile(e.dataTransfer.files[0]);});
document.getElementById('login-pass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
function checkShareUrl(){var p=new URLSearchParams(window.location.search);var t=p.get('token');if(t){loadShareInfo(t);return true;}return false;}
function loadShareInfo(token){fetch(API+'/share?token='+encodeURIComponent(token)).then(function(r){return r.json();}).then(function(r){if(r.code==='000'){shareData=r.data;document.getElementById('share-name').textContent=r.data.filename;var sz=r.data.size;document.getElementById('share-size').textContent=sz>1048576?(sz/1048576).toFixed(1)+'MB':sz>1024?(sz/1024).toFixed(1)+'KB':sz+'B';document.getElementById('share-expire').textContent=r.data.expire||'-';document.getElementById('share-download-btn').dataset.url=r.data.download_url;showPage('page-share');}else{toast(r.message||'Invalid','error');showPage('page-login');}}).catch(function(){toast('Network error','error');});}
function shareDownload(){var url=document.getElementById('share-download-btn').dataset.url;if(url)window.open(url,'_blank');}
if(!checkShareUrl()){var s=localStorage.getItem('user');if(s){try{currentUser=JSON.parse(s);enterMain();}catch(e){showPage('page-login');}}else showPage('page-login');}
</script>
</body>
</html>
